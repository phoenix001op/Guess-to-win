<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>GuessToWin</title>

  <link rel="stylesheet" href="style.css">

  <script src="/socket.io/socket.io.js"></script>
</head>

<body>

<!-- =========================================================
     HOME
========================================================= -->

<section id="homePage" class="page active">

  <div class="home-container">

    <div class="brand">
      <h1>GuessToWin</h1>
      <p>Draw. Guess. Win.</p>
    </div>

    <div class="home-card">

      <label>Your name</label>

      <input
        id="playerNameInput"
        type="text"
        maxlength="20"
        placeholder="Enter your name"
        autocomplete="off"
      >

      <button id="createRoomBtn" class="primary-btn">
        Create Room
      </button>

      <button id="roomBtn" class="secondary-btn">
        Room
      </button>

      <!-- JOIN ROOM PANEL -->

      <div id="joinPanel" class="join-panel hidden">

        <div class="panel-header">
          <h2>Join Room</h2>

          <button
            id="closeJoinBtn"
            class="close-btn"
          >
            ×
          </button>
        </div>

        <input
          id="roomCodeInput"
          type="text"
          maxlength="6"
          placeholder="ROOM CODE"
          autocomplete="off"
        >

        <button
          id="joinRoomBtn"
          class="primary-btn"
        >
          Join Room
        </button>

      </div>

      <p id="homeError" class="error hidden"></p>

    </div>

  </div>

</section>


<!-- =========================================================
     LOBBY
========================================================= -->

<section id="lobbyPage" class="page">

  <div class="lobby-container">

    <div class="lobby-top">

      <div>
        <span class="small-label">ROOM</span>

        <div
          id="lobbyRoomCode"
          class="room-code"
        >
          -----
        </div>
      </div>

      <div class="lobby-actions">

        <button
          id="copyCodeBtn"
          class="small-btn"
        >
          Copy
        </button>

        <button
          id="settingsBtn"
          class="small-btn"
        >
          Settings
        </button>

      </div>

    </div>

    <p class="lobby-subtitle">
      Share the room code with your friends.
    </p>


    <div class="players-card">

      <div class="card-title">
        <span>Players</span>
        <span id="playerCount">0</span>
      </div>

      <div id="lobbyPlayerList"></div>

    </div>


    <button
      id="startGameBtn"
      class="primary-btn start-btn"
    >
      Start Game
    </button>

    <p
      id="lobbyHint"
      class="hint"
    >
      Minimum 2 players required
    </p>


    <!-- =====================================================
         SETTINGS OVERLAY
    ====================================================== -->

    <div
      id="settingsOverlay"
      class="modal hidden"
    >

      <div class="modal-card">

        <div class="modal-header">

          <div>
            <span class="small-label">ROOM</span>
            <h2>Room Settings</h2>
          </div>

          <button
            id="closeSettingsBtn"
            class="close-btn"
          >
            ×
          </button>

        </div>


        <div class="setting-item">

          <label>
            Maximum Players
          </label>

          <select id="maxPlayersSetting">
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="8">8</option>
            <option value="10">10</option>
            <option value="12">12</option>
          </select>

        </div>


        <div class="setting-item">

          <label>
            Rounds
          </label>

          <select id="roundsSetting">
            <option value="1">1 Round</option>
            <option value="2">2 Rounds</option>
            <option value="3">3 Rounds</option>
            <option value="4">4 Rounds</option>
            <option value="5">5 Rounds</option>
            <option value="6">6 Rounds</option>
            <option value="8">8 Rounds</option>
            <option value="10">10 Rounds</option>
          </select>

        </div>


        <div class="setting-item">

          <label>
            Drawing Time
          </label>

          <select id="timerSetting">
            <option value="30">30 seconds</option>
            <option value="45">45 seconds</option>
            <option value="60">60 seconds</option>
            <option value="80">80 seconds</option>
            <option value="90">90 seconds</option>
            <option value="120">120 seconds</option>
          </select>

        </div>


        <button
          id="saveSettingsBtn"
          class="primary-btn"
        >
          Save Settings
        </button>


        <button
          id="leaveRoomFromSettings"
          class="danger-btn"
        >
          Leave Room
        </button>


        <p
          id="settingsMessage"
          class="settings-message"
        ></p>

      </div>

    </div>

  </div>

</section>


<!-- =========================================================
     GAME
========================================================= -->

<section id="gamePage" class="page">

  <div class="game-container">

    <!-- TOP -->

    <header class="game-header">

      <div id="roundDisplay">
        Round 1 / 3
      </div>

      <div class="timer">

        <div id="timerText">
          80
        </div>

      </div>

      <button
        id="leaveGameBtn"
        class="leave-btn"
      >
        Leave
      </button>

    </header>


    <!-- GAME BODY -->

    <main class="game-body">

      <!-- PLAYERS -->

      <aside class="players-side">

        <h3>Players</h3>

        <div id="gamePlayerList"></div>

      </aside>


      <!-- CANVAS -->

      <section class="drawing-section">

        <div class="word-display">

          <span id="wordHint">
            _ _ _ _
          </span>

        </div>


        <canvas
          id="drawCanvas"
        ></canvas>


        <!-- DRAWING TOOLS -->

        <div
          id="drawingTools"
          class="drawing-tools hidden"
        >

          <div class="colors">

            <button
              class="color-btn active"
              data-color="#000000"
              style="background:#000000"
            ></button>

            <button
              class="color-btn"
              data-color="#ffffff"
              style="background:#ffffff"
            ></button>

            <button
              class="color-btn"
              data-color="#ff0000"
              style="background:#ff0000"
            ></button>

            <button
              class="color-btn"
              data-color="#ff8800"
              style="background:#ff8800"
            ></button>

            <button
              class="color-btn"
              data-color="#ffd000"
              style="background:#ffd000"
            ></button>

            <button
              class="color-btn"
              data-color="#20b95a"
              style="background:#20b95a"
            ></button>

            <button
              class="color-btn"
              data-color="#00a9d6"
              style="background:#00a9d6"
            ></button>

            <button
              class="color-btn"
              data-color="#315bea"
              style="background:#315bea"
            ></button>

            <button
              class="color-btn"
              data-color="#7c4dff"
              style="background:#7c4dff"
            ></button>

            <button
              class="color-btn"
              data-color="#ff4f91"
              style="background:#ff4f91"
            ></button>

          </div>


          <div class="tool-buttons">

            <button
              id="pencilTool"
              class="tool-btn active"
            >
              Pencil
            </button>

            <button
              id="eraserTool"
              class="tool-btn"
            >
              Eraser
            </button>

            <button
              id="clearBtn"
              class="tool-btn"
            >
              Clear
            </button>

          </div>


          <div class="brush-control">

            <span>Size</span>

            <input
              id="brushSize"
              type="range"
              min="2"
              max="40"
              value="5"
            >

            <span id="brushSizeLabel">
              5
            </span>

          </div>

        </div>

      </section>


      <!-- CHAT -->

      <aside class="chat-side">

        <h3>Chat</h3>

        <div
          id="chatMessages"
          class="chat-messages"
        ></div>


        <div class="chat-input">

          <input
            id="chatInput"
            type="text"
            maxlength="200"
            placeholder="Type your guess..."
            autocomplete="off"
          >

          <button
            id="chatSendBtn"
            class="primary-btn"
          >
            Send
          </button>

        </div>

      </aside>

    </main>


    <!-- =====================================================
         WORD CHOICE
    ====================================================== -->

    <div
      id="wordChoiceOverlay"
      class="word-choice-overlay hidden"
    >

      <div class="word-choice-card">

        <h1>Choose word</h1>

        <p>
          Pick one word to draw
        </p>

        <div
          id="wordChoiceButtons"
          class="word-choice-buttons"
        ></div>

      </div>

    </div>


    <!-- RESULT -->

    <div
      id="resultOverlay"
      class="modal hidden"
    >

      <div class="modal-card result-card">

        <span class="small-label">
          ROUND COMPLETE
        </span>

        <h2>
          The word was
        </h2>

        <div
          id="revealedWord"
          class="revealed-word"
        >
        </div>

      </div>

    </div>


    <!-- GAME OVER -->

    <div
      id="gameOverOverlay"
      class="modal hidden"
    >

      <div class="modal-card">

        <span class="small-label">
          GAME COMPLETE
        </span>

        <h2>
          Game Over
        </h2>

        <div
          id="finalRankings"
          class="final-rankings"
        ></div>

        <button
          id="playAgainBtn"
          class="primary-btn"
        >
          Play Again
        </button>

        <button
          id="backLobbyBtn"
          class="secondary-btn"
        >
          Back to Lobby
        </button>

      </div>

    </div>

  </div>

</section>


<script src="script.js"></script>

</body>
</html>
